name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Run authentication, cart, localization, and CSV tests
        working-directory: frontend
        run: npm test

      - name: Build and type-check
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        working-directory: backend
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify module checksums
        working-directory: backend
        run: go mod verify

      - name: Run static analysis
        working-directory: backend
        run: go vet ./...

      - name: Run authorization, marketplace, order, import, and chat tests
        working-directory: backend
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Report package coverage
        working-directory: backend
        run: go tool cover -func=coverage.out

      - name: Build
        working-directory: backend
        run: go build -mod=readonly ./...

  ai-service:
    name: AI service
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai_service/requirements.txt

      - name: Install dependencies
        working-directory: ai_service
        run: python -m pip install -r requirements.txt

      - name: Check installed dependencies
        working-directory: ai_service
        run: python -m pip check

      - name: Compile all Python modules
        working-directory: ai_service
        run: python -m compileall -q .

      - name: Run agent, authorization, RAG, tool, and recommender tests
        working-directory: ai_service
        run: python -m unittest discover -s tests -v

  database:
    name: PostgreSQL and pgvector schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: ci_user
      PGPASSWORD: ci_password
      PGDATABASE: transcendence_ci

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: transcendence_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d transcendence_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply fresh schema and seed data
        run: psql --set ON_ERROR_STOP=1 --file db/init.sql

      - name: Verify marketplace, identity, messaging, analytics, and RAG schema
        shell: bash
        run: |
          assert_sql_true() {
            description="$1"
            query="$2"
            result="$(psql --tuples-only --no-align --set ON_ERROR_STOP=1 --command "$query")"
            if [ "$result" != "t" ]; then
              echo "Schema assertion failed: $description"
              exit 1
            fi
          }

          assert_sql_true \
            "pgvector extension" \
            "SELECT EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'vector');"

          assert_sql_true \
            "required feature tables" \
            "SELECT bool_and(to_regclass('public.' || table_name) IS NOT NULL)
             FROM unnest(ARRAY[
               'users',
               'listings',
               'listing_images',
               'orders',
               'payments',
               'stripe_webhook_events',
               'friendships',
               'messages',
               'notifications',
               'reviews',
               'listing_reviews',
               'api_keys',
               'api_request_logs',
               'analytics_events',
               'knowledge_chunks'
             ]) AS required(table_name);"

          assert_sql_true \
            "required cross-feature columns" \
            "SELECT count(*) = 42
             FROM (VALUES
               ('users', 'account_status'),
               ('users', 'role'),
               ('users', 'deleted_at'),
               ('users', 'oauth_id'),
               ('users', 'requires_2fa'),
               ('listings', 'seller_id'),
               ('listings', 'stock_quantity'),
               ('listings', 'status'),
               ('orders', 'buyer_id'),
               ('orders', 'seller_id'),
               ('orders', 'quantity'),
               ('orders', 'status'),
               ('orders', 'payment_id'),
               ('payments', 'checkout_request_id'),
               ('payments', 'stripe_idempotency_key'),
               ('payments', 'buyer_id'),
               ('payments', 'seller_id'),
               ('payments', 'provider'),
               ('payments', 'currency'),
               ('payments', 'amount_minor'),
               ('payments', 'platform_fee_minor'),
               ('payments', 'status'),
               ('payments', 'stripe_checkout_session_id'),
               ('payments', 'stripe_payment_intent_id'),
               ('payments', 'stock_released'),
               ('stripe_webhook_events', 'stripe_event_id'),
               ('stripe_webhook_events', 'event_type'),
               ('notifications', 'user_id'),
               ('notifications', 'notification_type'),
               ('notifications', 'data'),
               ('notifications', 'read_at'),
               ('listing_reviews', 'listing_id'),
               ('listing_reviews', 'reviewer_id'),
               ('listing_reviews', 'order_id'),
               ('listing_reviews', 'rating'),
               ('api_keys', 'key_hash'),
               ('api_keys', 'rate_limit'),
               ('analytics_events', 'listing_id'),
               ('knowledge_chunks', 'embedding'),
               ('knowledge_chunks', 'ingestion_version'),
               ('knowledge_chunks', 'is_active'),
               ('knowledge_chunks', 'search_vector')
             ) AS required(table_name, column_name)
             JOIN information_schema.columns actual
               ON actual.table_schema = 'public'
              AND actual.table_name = required.table_name
              AND actual.column_name = required.column_name;"

          assert_sql_true \
            "authorization, audit, messaging, and RAG indexes" \
            "SELECT bool_and(to_regclass('public.' || index_name) IS NOT NULL)
             FROM unnest(ARRAY[
               'idx_users_oauth_identity',
               'idx_api_request_logs_key',
               'idx_messages_sender_receiver',
               'idx_notifications_user_order',
               'idx_notifications_user_unread',
               'idx_notifications_unread_message_group',
               'idx_listing_reviews_listing_newest',
               'idx_orders_payment_id',
               'idx_payments_buyer_created',
               'idx_payments_seller_status_created',
               'idx_payments_stripe_session_unique',
               'idx_payments_stripe_intent_unique',
               'idx_knowledge_chunks_active',
               'idx_knowledge_chunks_search'
             ]) AS required(index_name);"

          assert_sql_true \
            "payment constraints and foreign key" \
            "SELECT count(*) = 8
             FROM pg_constraint
             WHERE conname IN (
               'payments_checkout_request_unique',
               'payments_stripe_idempotency_unique',
               'payments_provider_check',
               'payments_currency_check',
               'payments_amount_check',
               'payments_fee_check',
               'payments_status_check',
               'orders_payment_id_fkey'
             );"

          assert_sql_true \
            "vector-backed knowledge columns" \
            "SELECT count(*) = 2
             FROM information_schema.columns
             WHERE table_schema = 'public'
               AND table_name IN ('faq_embeddings', 'knowledge_chunks')
               AND column_name = 'embedding'
               AND udt_name = 'vector';"

          assert_sql_true \
            "generated full-text RAG search column" \
            "SELECT is_generated = 'ALWAYS'
             FROM information_schema.columns
             WHERE table_schema = 'public'
               AND table_name = 'knowledge_chunks'
               AND column_name = 'search_vector';"

          assert_sql_true \
            "usable marketplace seed data" \
            "SELECT
               (SELECT count(*) > 0 FROM users)
               AND (SELECT count(*) > 0 FROM listings);"

  backend-smoke:
    name: Backend API and PostgreSQL smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - backend
      - database
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: ci_user
      PGPASSWORD: ci_password
      PGDATABASE: transcendence_ci
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: ci_user
      DB_PASSWORD: ci_password
      DB_NAME: transcendence_ci
      SERVER_PORT: "8080"
      JWT_SECRET: ci-jwt-secret-that-is-longer-than-thirty-two-characters
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD_HASH: ci-admin-password
      AI_SERVICE_URL: http://127.0.0.1:18000

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: transcendence_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d transcendence_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply database schema
        run: psql --set ON_ERROR_STOP=1 --file db/init.sql

      - name: Build backend smoke-test binary
        working-directory: backend
        run: go build -mod=readonly -o "$RUNNER_TEMP/transcendence-backend" .

      - name: Exercise health, marketplace, admin, and authorization boundaries
        shell: bash
        run: |
          backend_log="$RUNNER_TEMP/backend-smoke.log"
          "$RUNNER_TEMP/transcendence-backend" >"$backend_log" 2>&1 &
          backend_pid=$!

          cleanup() {
            status=$?
            kill "$backend_pid" 2>/dev/null || true
            wait "$backend_pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              echo "Backend log:"
              sed -n '1,240p' "$backend_log"
            fi
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo "Backend did not become ready"
            exit 1
          fi

          assert_status() {
            expected="$1"
            url="$2"
            shift 2
            actual="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$@" "$url")"
            if [ "$actual" != "$expected" ]; then
              echo "Expected HTTP $expected from $url, got $actual"
              exit 1
            fi
          }

          health_body="$(curl --fail --silent --show-error http://127.0.0.1:8080/health)"
          grep --quiet '"db":"connected"' <<<"$health_body"

          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/status >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/products >/dev/null
          metrics_body="$(curl --fail --silent --show-error http://127.0.0.1:8080/metrics)"
          grep --quiet "go_gc_duration_seconds" <<<"$metrics_body"

          assert_status "401" "http://127.0.0.1:8080/api/v1/orders"
          assert_status "401" "http://127.0.0.1:8080/api/v1/notifications"
          assert_status "401" "http://127.0.0.1:8080/api/v1/admin/summary"
          assert_status "401" "http://127.0.0.1:8080/api/public/v1/products"

          admin_token="$(
            curl --fail --silent --show-error \
              --header "Content-Type: application/json" \
              --data '{"username":"ci-admin","password":"ci-admin-password"}' \
              http://127.0.0.1:8080/api/v1/admin/auth/login |
              python3 -c 'import json, sys; print(json.load(sys.stdin)["token"])'
          )"
          test -n "$admin_token"

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $admin_token" \
            http://127.0.0.1:8080/api/v1/admin/summary >/dev/null

          assert_status \
            "403" \
            "http://127.0.0.1:8080/api/v1/orders" \
            --header "Authorization: Bearer $admin_token"

  containers:
    name: Containers, reverse proxy, and WAF
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs:
      - frontend
      - backend
      - ai-service
      - database
    env:
      DB_USER: ci_user
      DB_PASSWORD: ci_password
      DB_NAME: transcendence_ci
      JWT_SECRET: ci-jwt-secret-that-is-longer-than-thirty-two-characters
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD_HASH: ci-admin-password
      DEEPSEEK_API_KEY: ci-deepseek-key
      OPENROUTER_API_KEY: ci-openrouter-key
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      GOOGLE_REDIRECT_URL: ""
      WAF_HTTP_PORT: "18088"
      WAF_HTTPS_PORT: "18443"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build AI and backup images
        run: docker compose build ai db-backup

      - name: Build and start the core marketplace stack
        run: >-
          docker compose up
          --detach
          --build
          --wait
          --wait-timeout 180
          db backend frontend nginx waf

      - name: Exercise public routing, authorization gates, and WAF rules
        shell: bash
        run: |
          https_base="https://127.0.0.1:${WAF_HTTPS_PORT}"
          http_base="http://127.0.0.1:${WAF_HTTP_PORT}"

          ready=false
          for attempt in $(seq 1 30); do
            if curl --insecure --fail --silent "$https_base/healthz" >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "WAF did not become ready"
            exit 1
          fi

          assert_status() {
            expected="$1"
            url="$2"
            actual="$(curl --insecure --silent --show-error --output /dev/null --write-out '%{http_code}' "$url")"
            if [ "$actual" != "$expected" ]; then
              echo "Expected HTTP $expected from $url, got $actual"
              exit 1
            fi
          }

          redirect_status="$(
            curl --silent --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              "$http_base/"
          )"
          if [ "$redirect_status" != "301" ] && [ "$redirect_status" != "308" ]; then
            echo "Expected an HTTP-to-HTTPS redirect, got $redirect_status"
            exit 1
          fi

          assert_status "200" "$https_base/healthz"
          assert_status "200" "$https_base/api/v1/status"
          assert_status "200" "$https_base/api/v1/products"
          assert_status "401" "$https_base/api/v1/orders"
          assert_status "401" "$https_base/api/v1/notifications"
          assert_status "401" "$https_base/api/public/v1/products"
          assert_status "403" "$https_base/api/v1/products?id=1%27%20OR%201%3D1%2D%2D"
          assert_status "403" "$https_base/?q=%3Cscript%3Ealert%281%29%3C%2Fscript%3E"

      - name: Show container logs after failure
        if: failure()
        run: docker compose logs --no-color --tail 240

      - name: Stop CI containers
        if: always()
        run: docker compose down --volumes --remove-orphans
