# RacketBot sends up to ten prior messages as JSON at POST /api/v1/ai/chat.
# CRS 930120 mistakes the role/content field names in that history array for a
# file-path access attempt. Remove only those exact field names from that one
# rule, and only for the RacketBot endpoint. The CRS rule remains active for
# every other argument and route.
SecRule REQUEST_METHOD "@streq POST" "id:1001001,phase:1,pass,nolog,chain"
    SecRule REQUEST_URI "@streq /api/v1/ai/chat" "ctl:ruleRemoveTargetById=930120;ARGS_NAMES:json.history.array_0.role,ctl:ruleRemoveTargetById=930120;ARGS_NAMES:json.history.array_0.content,ctl:ruleRemoveTargetById=930120;ARGS_NAMES:json.history.array_1.role,ctl:ruleRemoveTargetById=930120;ARGS_NAMES:json.history.array_1.content,ctl:ruleRemoveTargetById=930120;ARGS_NAMES:json.history.array_2.role,ctl:ruleRemoveTargetById=930120;ARGS_NAMES:json.history.array_2.content,ctl:ruleRemoveTargetById=930120;ARGS_NAMES:json.history.array_3.role,ctl:ruleRemoveTargetById=930120;ARGS_NAMES:json.history.array_3.content,ctl:ruleRemoveTargetById=930120;ARGS_NAMES:json.history.array_4.role,ctl:ruleRemoveTargetById=930120;ARGS_NAMES:json.history.array_4.content,ctl:ruleRemoveTargetById=930120;ARGS_NAMES:json.history.array_5.role,ctl:ruleRemoveTargetById=930120;ARGS_NAMES:json.history.array_5.content,ctl:ruleRemoveTargetById=930120;ARGS_NAMES:json.history.array_6.role,ctl:ruleRemoveTargetById=930120;ARGS_NAMES:json.history.array_6.content,ctl:ruleRemoveTargetById=930120;ARGS_NAMES:json.history.array_7.role,ctl:ruleRemoveTargetById=930120;ARGS_NAMES:json.history.array_7.content,ctl:ruleRemoveTargetById=930120;ARGS_NAMES:json.history.array_8.role,ctl:ruleRemoveTargetById=930120;ARGS_NAMES:json.history.array_8.content,ctl:ruleRemoveTargetById=930120;ARGS_NAMES:json.history.array_9.role,ctl:ruleRemoveTargetById=930120;ARGS_NAMES:json.history.array_9.content"

SecRule REQUEST_URI "@beginsWith /api/v1/auth/google/callback" \
    "id:10001,phase:1,pass,nolog,ctl:ruleRemoveTargetById=930120;ARGS:scope"

# Change-password JSON must include a strong password (special characters)
# twice on confirm. CRS scores those ARGS as SQLi/XSS. Inspect every other
# field and route as usual.
SecRule REQUEST_METHOD "@streq POST" "id:1001002,phase:1,pass,nolog,chain"
    SecRule REQUEST_URI "@streq /api/v1/auth/change-password/request" "ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.currentPassword,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.newPassword,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.confirmPassword,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:currentPassword,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:newPassword,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:confirmPassword"

SecRule REQUEST_METHOD "@streq POST" "id:1001003,phase:1,pass,nolog,chain"
    SecRule REQUEST_URI "@streq /api/v1/auth/change-password/confirm" "ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.newPassword,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.confirmPassword,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.otpCode,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.tempToken,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:newPassword,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:confirmPassword,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:otpCode,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:tempToken"

