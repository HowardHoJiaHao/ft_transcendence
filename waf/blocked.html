<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search blocked</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f6f5f3;
      color: #201f1e;
      font-family: Georgia, "Times New Roman", serif;
    }
    main {
      width: min(32rem, calc(100% - 2rem));
      background: #fff;
      border-radius: 12px;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    h1 {
      font-size: 1.4rem;
      margin: 0 0 0.75rem;
    }
    p {
      margin: 0 0 1.25rem;
      line-height: 1.5;
    }
    a {
      color: #201f1e;
    }
  </style>
</head>
<body>
  <main>
    <h1>Search blocked</h1>
    <p>That search was blocked by our security filter. Please rephrase it and try again.</p>
    <p><a href="/">Back to the shop</a></p>
  </main>
</body>
</html>
