services:
  # PostgreSQL Database
  db:
    #docker image,rather than build it
    image: pgvector/pgvector:pg15
    container_name: transcendence-postgres
    #default env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-transcendence_pass}
      POSTGRES_DB: ${DB_NAME:-transcendence}
      POSTGRES_USER: ${DB_USER:-transcendence}
    #might remove environment
    ports:
      - "5432:5432"
    #two volumes
    # first mount is where database lives
    # second mount is how the database is initially created
    # postgreSql needs a instructions for creating the database structure
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - transcendence-network
    #health check right after it up
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-transcendence} -d ${DB_NAME:-transcendence}"] 
      timeout: 20s
      retries: 10
      interval: 10s

  # Go 
  backend:
  #build image, by going to this directory, execute Dockerfile
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transcendence-backend
    env_file:
      - .env
      #backend to find postgreSql, running in the db container, refer to db.go,the db.go will use db container
    environment:
      DB_HOST: db
    expose:
      - "8080"
    #mapping the files in current project folders to container(bind mount)
    volumes:
      - ./uploads:/app/uploads
      - ./avatar:/app/avatar
      - ./static/avatars:/app/static/avatars
      - ./static/listings:/app/static/listings
    depends_on:
      db:
        condition: service_healthy
    networks:
      - transcendence-network

  # NextJS
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: transcendence-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://localhost}
      NODE_ENV: ${NODE_ENV:-development}
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - transcendence-network

  # need to change wai keong
  # Python AI Service (FastAPI + LangChain + RAG)
  ai:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: transcendence-ai
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - RACKETBOT_MODEL_CALL_LIMIT=${RACKETBOT_MODEL_CALL_LIMIT:-10}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_EMBEDDING_MODEL=${OPENROUTER_EMBEDDING_MODEL:-nvidia/llama-nemotron-embed-vl-1b-v2:free}
      - RACKETBOT_MODEL_TIMEOUT_SECONDS=${RACKETBOT_MODEL_TIMEOUT_SECONDS:-25}
      - RACKETBOT_MODEL_MAX_RETRIES=${RACKETBOT_MODEL_MAX_RETRIES:-1}
      - RACKETBOT_REQUEST_TIMEOUT_SECONDS=${RACKETBOT_REQUEST_TIMEOUT_SECONDS:-60}
      - RAG_EMBEDDING_BATCH_SIZE=${RAG_EMBEDDING_BATCH_SIZE:-2}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-transcendence}
      - DB_PASSWORD=${DB_PASSWORD:-transcendence_pass}
      - DB_NAME=${DB_NAME:-transcendence}
      - BACKEND_URL=http://backend:8080 # maybe need to change
    depends_on:
      db:
        condition: service_healthy
    networks:
      - transcendence-network
  # end of need to change wai keong 

  # Nginx
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: transcendence-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - transcendence-network

volumes:
  postgres_data:

networks:
  transcendence-network:
    driver: bridge
