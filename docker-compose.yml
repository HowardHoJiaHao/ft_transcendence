services:
  # PostgreSQL Database
  db:
    image: pgvector/pgvector:pg15
    container_name: transcendence-postgres
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-transcendence_pass}
      POSTGRES_DB: ${DB_NAME:-transcendence}
      POSTGRES_USER: ${DB_USER:-transcendence}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - transcendence-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-transcendence} -d ${DB_NAME:-transcendence}"]
      timeout: 20s
      retries: 10
      interval: 10s

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: transcendence-node-exporter
    command:
      - --path.rootfs=/host
    pid: host
    ports:
      - "9100:9100"
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped
    networks:
      - transcendence-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: transcendence-cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped
    networks:
      - transcendence-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: transcendence-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://${DB_USER:-transcendence}:${DB_PASSWORD:-transcendence_pass}@db:5432/${DB_NAME:-transcendence}?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - transcendence-network

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: transcendence-blackbox-exporter
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    ports:
      - "9115:9115"
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    restart: unless-stopped
    networks:
      - transcendence-network

  # Go 
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transcendence-backend
    env_file:
      - .env
    environment:
      DB_HOST: db
    expose:
      - "8080"
    volumes:
      - ./uploads:/app/uploads
      - ./avatar:/app/avatar
      - ./static/avatars:/app/static/avatars
      - ./static/listings:/app/static/listings
    depends_on:
      db:
        condition: service_healthy
    networks:
      - transcendence-network

  # NextJS
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: transcendence-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://localhost}
      NODE_ENV: ${NODE_ENV:-development}
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - transcendence-network

  # need to change wai keong
  # Python AI Service (FastAPI + LangChain + RAG)
  ai:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: transcendence-ai
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemma-4-31b-it:free}
      - OPENROUTER_EMBEDDING_MODEL=${OPENROUTER_EMBEDDING_MODEL:-nvidia/llama-nemotron-embed-vl-1b-v2:free}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-transcendence}
      - DB_PASSWORD=${DB_PASSWORD:-transcendence_pass}
      - DB_NAME=${DB_NAME:-transcendence}
      - BACKEND_URL=http://backend:8080 # maybe need to change
    depends_on:
      db:
        condition: service_healthy
    networks:
      - transcendence-network
  # end of need to change wai keong 

  # Nginx
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: transcendence-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - transcendence-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: transcendence-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    depends_on:
      - node-exporter
      - cadvisor
      - postgres-exporter
      - blackbox-exporter
    restart: unless-stopped
    networks:
      - transcendence-network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: transcendence-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped
    networks:
      - transcendence-network

  grafana:
    image: grafana/grafana-oss:11.1.0
    container_name: transcendence-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - transcendence-network

volumes:
  postgres_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:

networks:
  transcendence-network:
    driver: bridge
