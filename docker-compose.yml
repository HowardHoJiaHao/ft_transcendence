services:
  # PostgreSQL Database
  db:
    image: pgvector/pgvector:pg15
    container_name: transcendence-postgres
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-transcendence_pass}
      POSTGRES_DB: ${DB_NAME:-transcendence}
      POSTGRES_USER: ${DB_USER:-transcendence}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - transcendence-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-transcendence} -d ${DB_NAME:-transcendence}"] 
      timeout: 20s
      retries: 10
      interval: 10s

  # Go 
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transcendence-backend
    env_file:
      - .env
    environment:
      DB_HOST: db
    expose:
      - "8080"
    volumes:
      - ./uploads:/app/uploads
      - ./avatar:/app/avatar
      - ./static/avatars:/app/static/avatars
      - ./static/listings:/app/static/listings
    depends_on:
      db:
        condition: service_healthy
    networks:
      - transcendence-network

  # NextJS
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: transcendence-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://localhost}
      NODE_ENV: ${NODE_ENV:-development}
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - transcendence-network

  # need to change wai keong
  # Python AI Service (FastAPI + LangChain + RAG)
  ai:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: transcendence-ai
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-transcendence}
      - DB_PASSWORD=${DB_PASSWORD:-transcendence_pass}
      - DB_NAME=${DB_NAME:-transcendence}
      - BACKEND_URL=http://backend:8080 # maybe need to change
    depends_on:
      db:
        condition: service_healthy
    networks:
      - transcendence-network
  # end of need to change wai keong 

  # Nginx
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: transcendence-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - transcendence-network

  # ============================================
  # MONITORING STACK (DevOps module)
  # ============================================

  # cAdvisor: auto-watches every container's CPU/RAM/network. No code changes needed.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: transcendence-cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - transcendence-network

  # postgres-exporter: translates Postgres internal stats into Prometheus format
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: transcendence-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-transcendence}:${DB_PASSWORD:-transcendence_pass}@db:5432/${DB_NAME:-transcendence}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - transcendence-network

  # node-exporter: watches the host machine itself (disk space, host memory, etc.)
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: transcendence-node-exporter
    networks:
      - transcendence-network

  # Prometheus: the "brain" that pulls stats from all exporters above on a schedule
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: transcendence-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - cadvisor
      - postgres-exporter
      - node-exporter
    networks:
      - transcendence-network

  # Alertmanager: decides where triggered alerts get sent (Discord/email/etc.)
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: transcendence-alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    networks:
      - transcendence-network

  # Grafana: the dashboard website (this is YOUR part, Person B)
  grafana:
    image: grafana/grafana:10.4.2
    container_name: transcendence-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - transcendence-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  transcendence-network:
    driver: bridge
