services:
  db:
    image: pgvector/pgvector:pg15
    container_name: transcendence-postgres
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-transcendence}
      POSTGRES_USER: ${DB_USER:-transcendence}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - transcendence-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-transcendence} -d ${DB_NAME:-transcendence}",
        ]
      timeout: 20s
      retries: 10
      interval: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transcendence-backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SERVER_PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-transcendence}
      DB_USER: ${DB_USER:-transcendence}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-wongdakfat}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      AI_SERVICE_URL: http://ai:8000
    expose:
      - "8080"
    volumes:
      - ./uploads:/app/uploads
      - ./avatar:/app/avatar
      - ./static/avatars:/app/static/avatars
      - ./static/listings:/app/static/listings
    depends_on:
      db:
        condition: service_healthy
    networks:
      - transcendence-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: transcendence-frontend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - transcendence-network

  ai:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: transcendence-ai
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      RACKETBOT_MODEL_CALL_LIMIT: ${RACKETBOT_MODEL_CALL_LIMIT:-10}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-nvidia/llama-nemotron-embed-vl-1b-v2:free}
      RACKETBOT_MODEL_TIMEOUT_SECONDS: ${RACKETBOT_MODEL_TIMEOUT_SECONDS:-25}
      RACKETBOT_MODEL_MAX_RETRIES: ${RACKETBOT_MODEL_MAX_RETRIES:-1}
      RACKETBOT_REQUEST_TIMEOUT_SECONDS: ${RACKETBOT_REQUEST_TIMEOUT_SECONDS:-60}
      RAG_EMBEDDING_BATCH_SIZE: ${RAG_EMBEDDING_BATCH_SIZE:-2}
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-transcendence}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-transcendence}
      BACKEND_URL: http://backend:8080
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - transcendence-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: transcendence-nginx
    expose:
      - "8081"
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - transcendence-network

  waf:
    image: owasp/modsecurity-crs:4.25.0-nginx-lts
    container_name: transcendence-waf
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      BACKEND: http://nginx:8081
      SERVER_NAME: localhost
      NGINX_ALWAYS_TLS_REDIRECT: "on"
      MODSEC_RULE_ENGINE: "On"
      MODSEC_AUDIT_ENGINE: "RelevantOnly"
      BLOCKING_PARANOIA: "1"
      DETECTION_PARANOIA: "1"
      REPORTING_LEVEL: "2"
      ALLOWED_METHODS: "GET HEAD POST PUT PATCH DELETE OPTIONS"
      MODSEC_REQ_BODY_LIMIT: "73400320"
      MAX_FILE_SIZE: "10485760"
      COMBINED_FILE_SIZES: "62914560"
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - transcendence-network

volumes:
  postgres_data:

networks:
  transcendence-network:
    driver: bridge
