services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: transcendence-postgres
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-transcendence_pass}
      POSTGRES_DB: ${DB_NAME:-transcendence}
      POSTGRES_USER: ${DB_USER:-transcendence}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - transcendence-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-transcendence} -d ${DB_NAME:-transcendence}"] 
      timeout: 20s
      retries: 10
      interval: 10s

  # Go 
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transcendence-backend
    env_file:
      - .env
    environment:
      DB_HOST: db
    expose:
      - "8080"
    volumes:
      - ./uploads:/app/uploads
      - ./avatar:/app/avatar
      - ./static/avatars:/app/static/avatars
    depends_on:
      db:
        condition: service_healthy
    networks:
      - transcendence-network

  # NextJS
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: transcendence-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://localhost}
      NODE_ENV: ${NODE_ENV:-development}
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - transcendence-network

  # Nginx
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: transcendence-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - transcendence-network

volumes:
  postgres_data:

networks:
  transcendence-network:
    driver: bridge
