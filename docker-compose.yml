services:
  db:
    image: pgvector/pgvector:pg15
    container_name: transcendence-postgres
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-transcendence}
      POSTGRES_USER: ${DB_USER:-transcendence}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - transcendence-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-transcendence} -d ${DB_NAME:-transcendence}",
        ]
      timeout: 20s
      retries: 10
      interval: 10s

  # node-exporter:
  #   image: prom/node-exporter:v1.8.1
  #   container_name: transcendence-node-exporter
  #   command:
  #     - --path.rootfs=/host
  #     - --collector.textfile.directory=/metrics
  #   # pid: host
  #   ports:
  #     - "127.0.0.1:9100:9100"
  #   volumes:
  #     - /:/host:ro,rslave
  #     - backup_metrics:/metrics:ro
  #   restart: unless-stopped
  #   networks:
  #     - transcendence-network

  # cadvisor:
  #   image: gcr.io/cadvisor/cadvisor:v0.49.1
  #   container_name: transcendence-cadvisor
  #   privileged: true
  #   devices:
  #     - /dev/kmsg
  #   ports:
  #     - "127.0.0.1:8081:8080"
  #   volumes:
  #     - /:/rootfs:ro,rslave
  #     - /var/run:/var/run:rw
  #     - /sys:/sys:ro,rslave
  #     - /var/lib/docker/:/var/lib/docker:ro,rslave
  #     - /dev/disk/:/dev/disk:ro
  #   restart: unless-stopped
  #   networks:
  #     - transcendence-network
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: transcendence-node-exporter
    command:
      - --collector.textfile.directory=/metrics
    volumes:
      - backup_metrics:/metrics:ro
    restart: unless-stopped
    networks:
      - transcendence-network


  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: transcendence-cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - /var/run:/var/run:rw
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped
    networks:
      - transcendence-network


  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: transcendence-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://${DB_USER:-transcendence}:${DB_PASSWORD:-transcendence_pass}@db:5432/${DB_NAME:-transcendence}?sslmode=disable
    ports:
      - "127.0.0.1:9187:9187"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - transcendence-network

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: transcendence-blackbox-exporter
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    ports:
      - "127.0.0.1:9115:9115"
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    restart: unless-stopped
    networks:
      - transcendence-network

  # Go
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transcendence-backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SERVER_PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-transcendence}
      DB_USER: ${DB_USER:-transcendence}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-wongdakfat}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      AI_SERVICE_URL: http://ai:8000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL}
      FRONTEND_URL: ${FRONTEND_URL:-}
    expose:
      - "8080"
    volumes:
      - ./uploads:/app/uploads
      - ./avatar:/app/avatar
      - ./static/avatars:/app/static/avatars
      - ./static/listings:/app/static/listings
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - transcendence-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: transcendence-frontend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - transcendence-network

  ai:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: transcendence-ai
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      RACKETBOT_MODEL_CALL_LIMIT: ${RACKETBOT_MODEL_CALL_LIMIT:-10}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-nvidia/llama-nemotron-embed-vl-1b-v2:free}
      RACKETBOT_MODEL_TIMEOUT_SECONDS: ${RACKETBOT_MODEL_TIMEOUT_SECONDS:-25}
      RACKETBOT_MODEL_MAX_RETRIES: ${RACKETBOT_MODEL_MAX_RETRIES:-1}
      RACKETBOT_REQUEST_TIMEOUT_SECONDS: ${RACKETBOT_REQUEST_TIMEOUT_SECONDS:-60}
      RAG_EMBEDDING_BATCH_SIZE: ${RAG_EMBEDDING_BATCH_SIZE:-2}
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-transcendence}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-transcendence}
      BACKEND_URL: http://backend:8080
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - transcendence-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: transcendence-nginx
    expose:
      - "8081"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - transcendence-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: transcendence-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    depends_on:
      - node-exporter
      - cadvisor
      - postgres-exporter
      - blackbox-exporter
    restart: unless-stopped
    networks:
      - transcendence-network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: transcendence-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped
    networks:
      - transcendence-network

  discord-webhook-relay:
    image: python:3.12-slim
    container_name: transcendence-discord-webhook-relay
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      RELAY_LOG_DIR: /var/log/alertmanager-relay
    volumes:
      - ./monitoring/alertmanager/discord_webhook_bridge.py:/app/discord_webhook_bridge.py:ro
      - ./monitoring/alertmanager/logs:/var/log/alertmanager-relay
    command: ["python", "/app/discord_webhook_bridge.py"]
    ports:
      - "127.0.0.1:5001:5001"
    restart: unless-stopped
    networks:
      - transcendence-network

  # Loki: stores and makes searchable all container logs (the "historical
  # logging" that was flagged as missing). Metrics = numbers over time.
  # Logs = actual text output. This is the log equivalent of Prometheus.
  loki:
    image: grafana/loki:3.1.0
    container_name: transcendence-loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    restart: unless-stopped
    networks:
      - transcendence-network

  # Promtail: reads every container's logs (via the docker socket) and ships
  # them to Loki. This is the "collector" — no app code changes needed.
  promtail:
    image: grafana/promtail:3.1.0
    container_name: transcendence-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Rootful Docker uses these defaults. For rootless Docker, set
      # DOCKER_SOCKET_PATH and DOCKER_CONTAINERS_PATH to its user-owned paths.
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - ${DOCKER_CONTAINERS_PATH:-/var/lib/docker/containers}:/var/lib/docker/containers:ro
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - transcendence-network

  # Disaster recovery: automatic database backups on a schedule.
  # RPO (Recovery Point Objective) = how much data we could lose in the worst
  # case = the BACKUP_INTERVAL_SECONDS value (default 6h below).
  db-backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: transcendence-db-backup
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-transcendence}
      DB_PASSWORD: ${DB_PASSWORD:-transcendence_pass}
      DB_NAME: ${DB_NAME:-transcendence}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./backups:/backups
      - backup_metrics:/metrics
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - transcendence-network

  grafana:
    image: grafana/grafana-oss:11.1.0
    container_name: transcendence-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - transcendence-network
  waf:
    image: owasp/modsecurity-crs:4.25.0-nginx-lts
    container_name: transcendence-waf
    ports:
      # Rootless Docker cannot bind privileged host ports (<1024). These
      # defaults are also configurable when either host port is already used.
      - "${WAF_HTTP_PORT:-8088}:8080"
      - "${WAF_HTTPS_PORT:-8443}:8443"
    environment:
      BACKEND: http://nginx:8081
      SERVER_NAME: localhost
      NGINX_ALWAYS_TLS_REDIRECT: "on"
      MODSEC_RULE_ENGINE: "On"
      MODSEC_AUDIT_ENGINE: "RelevantOnly"
      BLOCKING_PARANOIA: "1"
      DETECTION_PARANOIA: "1"
      REPORTING_LEVEL: "2"
      ALLOWED_METHODS: "GET HEAD POST PUT PATCH DELETE OPTIONS"
      MODSEC_REQ_BODY_LIMIT: "75497472"
      MAX_FILE_SIZE: "10485760"
      COMBINED_FILE_SIZES: "73400320"
    volumes:
      # Loaded before CRS rules. Keep application-specific exclusions narrow.
      - ./waf/racketbot-before.conf:/opt/owasp-crs/plugins/racketbot-before.conf:ro
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - transcendence-network

volumes:
  postgres_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  backup_metrics:

networks:
  transcendence-network:
    driver: bridge
