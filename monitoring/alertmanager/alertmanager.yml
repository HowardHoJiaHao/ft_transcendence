global:
  resolve_timeout: 5m

route:
  receiver: discord
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

receivers:
  - name: discord
    webhook_configs:
      - url: 'http://discord-webhook-relay:5001/alertmanager'
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ['alertname', 'job', 'instance']