# dashboard-provider.yml
# Concept: Without this, every time you restart Grafana you'd lose your dashboard
# and have to rebuild it by hand. This file says: "look in this folder, load whatever
# dashboard JSON files you find, automatically."

apiVersion: 1

providers:
  - name: "transcendence-dashboards"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
